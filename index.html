function AdminGate({bump,goSite}){
  const [state,setState]=useState('checking');
  const [email,setEmail]=useState('');
  const [password,setPassword]=useState('');
  const [error,setError]=useState('');
  const [busy,setBusy]=useState(false);
  const ADMIN_USER_ID='fed3dd35-0c4d-499a-b108-4f323309c459';
  useEffect(()=>{
    let alive=true;
    (async()=>{
      try{
        const sb=window.supabaseClient;
        if(!sb)throw new Error('Supabase bağlantısı başlatılamadı.');
        const {data,error}=await sb.auth.getSession();
        if(error)throw error;
        const user=data.session&&data.session.user;
        if(user&&user.id===ADMIN_USER_ID){if(alive)setState('ready');}
        else{
          if(user)await sb.auth.signOut();
          if(alive)setState('login');
        }
      }catch(e){if(alive){setError(e.message||String(e));setState('login');}}
    })();

      if(!alive)return;

  },[]);

      if(error)throw error;
      if(!data.user||data.user.id!==ADMIN_USER_ID){
        await sb.auth.signOut();
        throw new Error('Bu hesap yönetici olarak yetkilendirilmemiş. Yönetici hesabıyla giriş yapın.');
      }
      setState('ready');
    }catch(e){setError(e.message||'Giriş yapılamadı.');}
    finally{setBusy(false);}
  };
  const logout=async()=>{
    setBusy(true);

    finally{setBusy(false);}

  if(state!=='ready')return h('main',{className:'wrap',style:{maxWidth:520,paddingBlock:50}},
    h('section',{className:'panel',style:{padding:28,border:'1px solid var(--gold)',borderRadius:12}},
      h('h2',null,'Yönetici girişi'),

      error&&h('div',{className:'warn',role:'alert',style:{marginBottom:16}},error),
      h('form',{onSubmit:login},
        h('label',{style:{display:'block',marginBottom:6,fontWeight:600},htmlFor:'admin-email'},'E-posta'),
        h('input',{id:'admin-email',type:'email',autoComplete:'username',required:true,value:email,onChange:e=>setEmail(e.target.value),style:{width:'100%',padding:12,border:'1px solid var(--line)',borderRadius:6,background:'var(--card)',marginBottom:14}}),
        h('label',{style:{display:'block',marginBottom:6,fontWeight:600},htmlFor:'admin-password'},'Şifre'),
        h('input',{id:'admin-password',type:'password',autoComplete:'current-password',required:true,value:password,onChange:e=>setPassword(e.target.value),style:{width:'100%',padding:12,border:'1px solid var(--line)',borderRadius:6,background:'var(--card)',marginBottom:18}}),
        h('div',{className:'btns'},
          h('button',{className:'abtn p',type:'submit',disabled:busy},busy?'Giriş yapılıyor…':'Giriş yap'),
          h('button',{className:'abtn',type:'button',onClick:goSite},'Siteye dön')))));
  return h(React.Fragment,null,
    h('div',{className:'wrap',style:{display:'flex',justifyContent:'flex-end',paddingTop:10}},
      h('button',{className:'abtn',onClick:logout,disabled:busy},'Güvenli çıkış')),
    h(Admin,{bump,goSite}));
}
