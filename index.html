const dbCityId=v=>{const x=String(v||'').toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(x.includes('istanbul'))return 'ist';if(x.includes('bursa'))return 'bur';if(x.includes('edirne'))return 'edi';if(x.includes('canakkale'))return 'can';if(x.includes('kirklareli'))return 'kir';if(x.includes('tekirdag'))return 'tek';if(x.includes('kocaeli'))return 'koc';if(x.includes('sakarya')||x.includes('adapazari'))return 'sak';if(x.includes('yalova'))return 'yal';if(x.includes('balikesir'))return 'bal';if(x.includes('bilecik'))return 'bil';return 'unknown';};

async function persistManuscript(rec,f,cid,targetStatus){
  const sb=window.supabaseClient;
  if(!sb)throw new Error('Supabase bağlantısı bulunamadı.');
  let libraryId=f.libraryId||rec._libraryDbId||null;
  let libName=(f.libT||'').trim();
  if((libName||cid||libraryId)&&!CITIES.some(c=>c.id===cid))throw new Error('Bu proje yalnızca Marmara Bölgesi’nin 11 ilindeki kütüphaneleri kapsar. Lütfen Marmara Bölgesi’nden bir şehir seçin.');
  if(libraryId){
    const {data:library,error}=await sb.from('libraries').select('id,name,city').eq('id',libraryId).single();
    if(error)throw error;
    if(!library)throw new Error('Seçilen kütüphane bulunamadı. Kütüphaneler bölümünden yeniden seçin.');
    if(dbCityId(library.city)!==cid)throw new Error('Seçilen kütüphanenin şehri ile formdaki şehir uyuşmuyor.');
    libName=library.name||libName;
  }else if(libName){
    // Eski kayıtlarla uyumluluk: önceden serbest metinle girilmiş kütüphane kayıtlarını koru.
    let q=await sb.from('libraries').select('id').eq('name',libName).eq('city',cityOf(cid).n.tr).limit(1);
    if(q.error)throw q.error;
    libraryId=q.data&&q.data[0]?q.data[0].id:null;
    if(!libraryId){const {data,error}=await sb.from('libraries').insert({name:libName,city:cityOf(cid).n.tr,country:'Türkiye'}).select('id').single();if(error)throw error;libraryId=data.id;}
  }
  let workId=rec._workId||null;
  const peer=WORKS.find(x=>x.custom&&x.id!==rec.id&&f.wk&&String(x.wk)===String(f.wk));
  if(peer&&peer._workId)workId=peer._workId;
  const genre=f.type==='other'?(f.typeTxt||'other'):f.type;
  const workRow={title_original:(f.orig||'').trim(),title_transliteration:(f.tl||'').trim()||null,alternative_titles:(f.altTitles||'').trim()||null,genre:genre||null,language:(f.lang||[]).join(',')||null,composition_date_text:(f.coT||'').trim()||null,description:(f.workDesc||'').trim()||null};

function parseCatalogCSV(text){
  const rows=[];let row=[],cell='',quoted=false;
  for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"')quoted=false;else cell+=c;}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell='';}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell='';}else cell+=c;}
  if(cell.length||row.length){row.push(cell.replace(/\r$/,''));rows.push(row);}
  if(rows.length<2)return [];
  const heads=rows.shift().map(x=>x.replace(/^\uFEFF/,'').trim().toLocaleLowerCase('tr'));
  return rows.filter(r=>r.some(x=>String(x||'').trim())).map(r=>Object.fromEntries(heads.map((k,i)=>[k,String(r[i]||'').trim()])));
}

function LibraryMap({libraries=[],editable=false,onPick,onLibrarySelect}){
  const el=useRef(null),mapRef=useRef(null),markersRef=useRef(null),pickRef=useRef(onPick),selectRef=useRef(onLibrarySelect);

        if(data&&data.publicUrl){const img=document.createElement('img');img.src=data.publicUrl;img.alt=(lib.name||'Kütüphane')+' fotoğrafı';img.loading='lazy';popup.appendChild(img);}

      const button=document.createElement('button');button.type='button';button.textContent='Bu kütüphanenin eserlerini göster';
      button.addEventListener('click',()=>{const fn=selectRef.current;if(fn)fn(lib);});

    });

}
