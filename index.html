function AdminGate({bump,goSite}){

  if(state!=='ready')return h('main',{className:'wrap',style:{maxWidth:520,paddingBlock:50}},
    h('section',{className:'panel',style:{padding:28,border:'1px solid var(--gold)',borderRadius:12}},
      h('h2',null,'Yönetici girişi'),
      h('p',{className:'dim'},'Yönetim paneline erişmek için yetkili Supabase hesabınızla giriş yapın.'),
      error&&h('div',{className:'warn',role:'alert',style:{marginBottom:16}},error),
      h('form',{onSubmit:login},
        h('label',{style:{display:'block',marginBottom:6,fontWeight:600},htmlFor:'admin-email'},'E-posta'),
        h('input',{id:'admin-email',type:'email',autoComplete:'username',required:true,value:email,onChange:e=>setEmail(e.target.value),style:{width:'100%',padding:12,border:'1px solid var(--line)',borderRadius:6,background:'var(--card)',marginBottom:14}}),

function LibraryMap({libraries=[],editable=false,onPick,onLibrarySelect}){
  const el=useRef(null),mapRef=useRef(null),markersRef=useRef(null),pickRef=useRef(onPick),selectRef=useRef(onLibrarySelect);
  pickRef.current=onPick;selectRef.current=onLibrarySelect;

    if(!el.current||!window.L||mapRef.current)return;
    const map=window.L.map(el.current,{scrollWheelZoom:false}).setView([40.7,28.5],7);
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);

  },[editable]);

    const points=(libraries||[]).filter(x=>x.location_verified===true&&isMarmaraCity(x.city)&&isMarmaraCoordinate(Number(x.latitude),Number(x.longitude)));
    points.forEach(lib=>{
      const marker=window.L.marker([Number(lib.latitude),Number(lib.longitude)]).addTo(group);
      const popup=document.createElement('div');popup.className='library-popup';
      const strong=document.createElement('strong');strong.textContent=lib.name||'Kütüphane';popup.appendChild(strong);
      const meta=document.createElement('div');meta.textContent=[lib.city,lib.country||'Türkiye'].filter(Boolean).join(' · ');popup.appendChild(meta);
      if(lib.photo_storage_path){
        const {data}=window.supabaseClient.storage.from('library-photos').getPublicUrl(lib.photo_storage_path);
        if(data&&data.publicUrl){const img=document.createElement('img');img.src=data.publicUrl;img.alt=(lib.name||'Kütüphane')+' fotoğrafı';img.loading='lazy';popup.appendChild(img);}
      }
      if(lib.photo_caption){const caption=document.createElement('div');caption.textContent=lib.photo_caption;popup.appendChild(caption);}
      const count=document.createElement('div');count.textContent=String(lib.manuscript_count||0)+' yayımlanmış yazma nüsha';popup.appendChild(count);
      const button=document.createElement('button');button.type='button';button.textContent='Bu kütüphanenin eserlerini göster';
      button.addEventListener('click',()=>{const fn=selectRef.current;if(fn)fn(lib);});
      popup.appendChild(button);marker.bindPopup(popup,{maxWidth:260});
    });
    if(points.length){const bounds=window.L.latLngBounds(points.map(x=>[Number(x.latitude),Number(x.longitude)]));map.fitBounds(bounds.pad(.18),{maxZoom:12});}
    else map.setView([40.7,28.5],7);
    window.setTimeout(()=>map.invalidateSize(),80);
  },[libraries]);

}
